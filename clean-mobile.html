<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Subway® Store & Online Menu</title>
  <link rel="shortcut icon" href="https://eversub.dotpe.in/favicon.ico"/>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      background-color: #eceae3;
      height: 100%;
      width: 100%;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .mobile-frame {
      width: 500px;
      max-width: 100vw;
      height: calc(100vh - 24px);
      margin-top: 24px;
      background: #ffffff;
      border-radius: 28px 28px 0 0;
      border: none;
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.12), 0 3px 12px rgba(0, 0, 0, 0.05);
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .mobile-frame iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #ffffff;
      flex: 1 1 auto;
    }
  </style>
</head>
<body>
  <div class="mobile-frame">
    <iframe id="menuFrame" src="" title="Subway"></iframe>
  </div>

  <script>
    // If accessed on a mobile device, redirect directly to native full-screen mobile view
    if (/Mobile|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || window.innerWidth <= 600) {
      window.location.replace('/store/521/1/999?view=mobile');
    } else {
      const iframe = document.getElementById('menuFrame');
      const urlParams = new URLSearchParams(window.location.search);
      urlParams.set('embedded', 'true');
      urlParams.set('_v', Date.now());
      const basePath = (window.location.pathname.startsWith('/store') || window.location.pathname.startsWith('/cart') || window.location.pathname.startsWith('/order') ? window.location.pathname : '/store/521/1/999');
      iframe.src = basePath + '?' + urlParams.toString() + window.location.hash;

      window.addEventListener('message', function(e) {
        if (e.data && e.data.type === 'EMBEDDED_NAVIGATE') {
          window.history.replaceState(null, '', e.data.path);
        }
      });
    }
  </script>
</body>
</html>
